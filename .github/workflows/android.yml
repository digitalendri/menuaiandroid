name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Lewati ikon: assets tidak lengkap"
          npx cap sync android

      - name: Izin mikrofon dan kamera (untuk input suara di situs AI)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$P" "$F" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$F"
          done
          grep -n "uses-permission" "$F"

      - name: Pakai debug keystore tetap (opsional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Memakai keystore dari secret."
          else
            echo "Tidak ada secret keystore, memakai keystore otomatis."
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: MenuAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
