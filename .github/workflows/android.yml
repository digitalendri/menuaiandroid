name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Lewati ikon: assets tidak lengkap"
          npx cap sync android

      - name: Izin mikrofon dan kamera (untuk input suara di situs AI)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$P" "$F" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$F"
          done
          grep -n "uses-permission" "$F"

      - name: Pasang tanda tangan tetap dari secret
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 kosong. APK akan memakai kunci acak dan tidak bisa di-upgrade."
            exit 1
          fi
          ALIAS="${KS_ALIAS:-androiddebugkey}"
          PASS="${KS_PASS:-android}"
          echo "$KS" | base64 -d > android/app/menuai.keystore
          echo "Memeriksa keystore (alias: $ALIAS)..."
          keytool -list -keystore android/app/menuai.keystore -storepass "$PASS" -alias "$ALIAS"
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("menuai.keystore")
                      storePassword "$PASS"
                      keyAlias "$ALIAS"
                      keyPassword "$PASS"
                  }
              }
          }
          EOF
          echo "Tanda tangan debug diarahkan ke menuai.keystore."

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Tampilkan sidik jari tanda tangan APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate (DN|SHA-256)" || true

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: MenuAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
