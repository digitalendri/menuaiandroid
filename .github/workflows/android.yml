name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Pasang patch profil WebView (login terpisah per akun)
        run: |
          python3 - <<'PY'
          import re, sys
          p = "node_modules/@capgo/inappbrowser/android/src/main/java/ee/forgr/capacitor_inappbrowser/WebViewDialog.java"
          s = open(p, encoding="utf-8").read()
          if "MENUAI_PROFILE_PATCH" in s:
              print("Patch profil sudah terpasang, dilewati.")
              sys.exit(0)
          pat = re.compile(r"^([ \t]*)this\._webView = findViewById\(R\.id\.browser_view\);[ \t]*\r?\n", re.M)
          found = pat.findall(s)
          if len(found) != 1:
              print("::error::Baris pembuatan WebView tidak ditemukan tepat satu kali (ditemukan %d). Versi plugin mungkin berubah." % len(found))
              sys.exit(1)
          snippet = r'''// MENUAI_PROFILE_PATCH: item dengan judul "menuai-profile:<id>" memakai profil WebView sendiri (cookie dan login terpisah).
          try {
              String menuaiTitle = this._options != null ? this._options.getTitle() : null;
              String menuaiPrefix = "menuai-profile:";
              if (menuaiTitle != null && menuaiTitle.startsWith(menuaiPrefix) && WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)) {
                  String menuaiName = "menuai_" + menuaiTitle.substring(menuaiPrefix.length()).replaceAll("[^A-Za-z0-9_]", "_");
                  WebViewCompat.setProfile(this._webView, menuaiName);
                  Log.i("InAppBrowser", "Profil WebView: " + menuaiName);
              }
          } catch (Throwable menuaiError) {
              Log.w("InAppBrowser", "Gagal memasang profil WebView", menuaiError);
          }
          '''
          def add(m):
              ind = m.group(1)
              return m.group(0) + "".join(ind + l + "\n" for l in snippet.splitlines())
          s = pat.sub(add, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("Patch profil WebView terpasang.")
          PY

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Lewati ikon: assets tidak lengkap"
          npx cap sync android

      - name: Izin mikrofon dan kamera (untuk input suara di situs AI)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$P" "$F" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$F"
          done
          grep -n "uses-permission" "$F"

      - name: Pasang tanda tangan tetap dari secret
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 kosong. APK akan memakai kunci acak dan tidak bisa di-upgrade."
            exit 1
          fi
          ALIAS="${KS_ALIAS:-androiddebugkey}"
          PASS="${KS_PASS:-android}"
          echo "$KS" | base64 -d > android/app/menuai.keystore
          echo "Memeriksa keystore (alias: $ALIAS)..."
          keytool -list -keystore android/app/menuai.keystore -storepass "$PASS" -alias "$ALIAS"
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("menuai.keystore")
                      storePassword "$PASS"
                      keyAlias "$ALIAS"
                      keyPassword "$PASS"
                  }
              }
          }
          EOF
          echo "Tanda tangan debug diarahkan ke menuai.keystore."

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Tampilkan sidik jari tanda tangan APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate (DN|SHA-256)" || true

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: MenuAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
