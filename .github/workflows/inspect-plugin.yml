name: Inspect InAppBrowser plugin

# Hanya membaca dan mencetak potongan kode plugin ke log. Tidak membangun APK dan tidak mengubah apa pun.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm install

      - name: Potongan kode plugin
        run: |
          D=node_modules/@capgo/inappbrowser/android/src/main/java/ee/forgr/capacitor_inappbrowser
          echo "=== A. WebViewDialog: tempat _webView dibuat ==="
          grep -nE "_webView\s*=|findViewById|setContentView|R\.layout|instanceId" "$D/WebViewDialog.java" | head -60
          echo
          echo "=== B. WebViewDialog baris 395-430 ==="
          sed -n '395,430p' "$D/WebViewDialog.java"
          echo
          echo "=== C. Options: title dan id ==="
          grep -nE "[Tt]itle|\bid\b|[Ii]d\(" "$D/Options.java" | head -40
          echo
          echo "=== D. InAppBrowserPlugin baris 380-470 ==="
          sed -n '380,470p' "$D/InAppBrowserPlugin.java"
