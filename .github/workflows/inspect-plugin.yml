name: Inspect InAppBrowser plugin

# Hanya membaca dan mencetak isi plugin ke log. Tidak membangun APK dan tidak mengubah apa pun.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm install

      - name: Versi dan daftar file plugin
        run: |
          D=node_modules/@capgo/inappbrowser
          echo "Versi plugin:"
          node -p "require('./$D/package.json').version"
          echo
          echo "File Android:"
          find "$D/android" \( -name "*.java" -o -name "*.kt" -o -name "build.gradle" \) -print0 | xargs -0 wc -l

      - name: build.gradle milik plugin
        run: cat node_modules/@capgo/inappbrowser/android/build.gradle

      - name: Bagian penting (pembuatan WebView, id jendela, cookie)
        run: |
          D=node_modules/@capgo/inappbrowser/android
          grep -rnE "new WebView\(|extends WebView|class .*WebView|\.loadUrl\(|setProfile|androidx\.webkit|CookieManager|getString\(\"id\"\)|\"id\"" \
            "$D" --include=*.java --include=*.kt | head -200
