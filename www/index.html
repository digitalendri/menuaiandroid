<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu AI</title>
<style>
:root{--bg:#eef2f0;--panel:#fff;--ink:#14211f;--mute:#5d6d69;--line:#d5dedb;--acc:#0e7c66;--accbg:#d9efe8;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--panel:#17211f;--ink:#e8f0ee;--mute:#92a39f;--line:#2a3835;--acc:#4fd1b3;--accbg:#1d3a33;--danger:#f2877f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
.sub{margin:0 0 18px;color:var(--mute);font-size:14px}
.row{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.item{flex:1;display:flex;align-items:center;gap:14px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-size:17px;text-align:left;min-height:60px}
.item:active{background:var(--accbg)}
.item span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.del{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:14px;padding:0 14px;font:inherit;font-size:14px;min-width:68px}
.del:active{color:var(--danger)}
.add{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0}
.add summary{padding:16px;font-weight:700;cursor:pointer;min-height:56px;display:flex;align-items:center}
.form{display:grid;gap:10px;padding:0 16px 16px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:var(--bg);padding:12px 16px;min-height:48px}
.msg{margin:0;font-size:13px;color:var(--danger);min-height:18px}
.note{margin-top:18px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Menu AI</h1>
  <p class="sub">Ketuk salah satu AI. Situsnya terbuka penuh layar. Tekan X atau tombol kembali untuk pulang ke sini.</p>
  <div id="list"></div>

  <details class="add">
    <summary>+ Tambah AI</summary>
    <div class="form">
      <input id="n" placeholder="Nama, misalnya Mistral" aria-label="Nama AI">
      <input id="u" placeholder="chat.mistral.ai" aria-label="Alamat situs" inputmode="url" autocapitalize="none">
      <p class="msg" id="msg"></p>
      <button class="btn" id="addbtn">Tambah ke daftar</button>
    </div>
  </details>
  <p class="note" id="note"></p>
</div>

<script>
var DEFAULTS=[
{n:"ChatGPT",u:"https://chatgpt.com",c:"#10a37f"},
{n:"Claude",u:"https://claude.ai",c:"#c0603a"},
{n:"Gemini",u:"https://gemini.google.com",c:"#4a6cf7"},
{n:"Grok",u:"https://grok.com",c:"#333b4a"},
{n:"Copilot",u:"https://copilot.microsoft.com",c:"#2b7bd6"},
{n:"Perplexity",u:"https://www.perplexity.ai",c:"#1f8a9e"},
{n:"DeepSeek",u:"https://chat.deepseek.com",c:"#4d6bfe"}
];
var KEY="menuai.custom",custom=[];
try{custom=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){custom=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(custom))}catch(e){}}
function $(id){return document.getElementById(id)}
function note(t){$("note").textContent=t||""}

function openAI(a){
  note("");
  var C=window.Capacitor;
  if(C&&C.Plugins&&C.Plugins.Browser){
    try{
      var r=C.Plugins.Browser.open({url:a.u,toolbarColor:"#0e7c66"});
      if(r&&r.catch)r.catch(function(){window.open(a.u,"_blank")});
      return;
    }catch(e){}
  }
  var w=window.open(a.u,"_blank");
  if(!w)note("Jendela diblokir. Izinkan popup untuk halaman ini.");
}

function render(){
  var box=$("list");box.innerHTML="";
  DEFAULTS.concat(custom.map(function(x){x.custom=true;x.c=x.c||"#6b7a76";return x})).forEach(function(a){
    var row=document.createElement("div");row.className="row";
    var b=document.createElement("button");b.className="item";
    var d=document.createElement("span");d.className="dot";d.style.background=a.c;d.textContent=a.n.charAt(0).toUpperCase();
    var t=document.createElement("span");t.className="name";t.textContent=a.n;
    b.appendChild(d);b.appendChild(t);b.onclick=function(){openAI(a)};
    row.appendChild(b);
    if(a.custom){
      var x=document.createElement("button");x.className="del";x.textContent="Hapus";x.setAttribute("aria-label","Hapus "+a.n);
      x.onclick=function(){custom=custom.filter(function(c){return c.n!==a.n});save();render()};
      row.appendChild(x);
    }
    box.appendChild(row);
  });
}

$("addbtn").onclick=function(){
  var n=$("n").value.trim(),u=$("u").value.trim(),m=$("msg");
  if(!n){m.textContent="Isi nama AI dulu.";return}
  if(!u){m.textContent="Isi alamat situsnya.";return}
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{new URL(u)}catch(e){m.textContent="Alamat situs tidak valid.";return}
  custom.push({n:n,u:u});save();render();
  $("n").value="";$("u").value="";m.textContent="";
};
["n","u"].forEach(function(id){$(id).oninput=function(){$("msg").textContent=""}});
render();
</script>
</body>
</html>
